<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching PageLoader -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a45d1" />
      <stop offset="45%" stop-color="#072db5" />
      <stop offset="100%" stop-color="#031568" />
    </linearGradient>

    <!-- Radial Cyan Glow Aura -->
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#031568" stop-opacity="0" />
    </radialGradient>

    <!-- Core Disc Gradient -->
    <radialGradient id="coreAura" cx="50%" cy="47%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#021f59" stop-opacity="0" />
    </radialGradient>

    <!-- Emblem Red Gradient -->
    <radialGradient id="redEmblem" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ee2624" />
      <stop offset="70%" stop-color="#c61a18" />
      <stop offset="100%" stop-color="#7d0505" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="35%" stop-color="#fdd835" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Cyan Neon Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Central Radial Glow -->
  <circle cx="256" cy="240" r="230" fill="url(#cyanAura)" />
  <circle cx="256" cy="240" r="140" fill="url(#coreAura)" />

  <!-- HIGH-TECH RADAR HUD RINGS (Matching PageLoader.tsx) -->
  <!-- Ring 1: Outer Dashed Ring -->
  <circle cx="256" cy="240" r="216" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.45" />

  <!-- Ring 2: Glowing Cyan HUD Ring -->
  <circle cx="256" cy="240" r="192" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" opacity="0.85" filter="url(#softGlow)" />

  <!-- Ring 3: Dot Matrix Ring -->
  <circle cx="256" cy="240" r="166" fill="none" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="3 7" opacity="0.7" />

  <!-- Ring 4: Precision Inner Ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />

  <!-- Ring 5: Core Command Ring (Glass Tint) -->
  <circle cx="256" cy="240" r="114" fill="#06b6d4" fill-opacity="0.12" stroke="#67e8f9" stroke-width="2" opacity="0.9" filter="url(#softGlow)" />

  <!-- Radar HUD Crosshair Ticks -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
    <line x1="256" y1="20" x2="256" y2="40" />
    <line x1="256" y1="440" x2="256" y2="460" />
    <line x1="36" y1="240" x2="56" y2="240" />
    <line x1="456" y1="240" x2="476" y2="240" />
    <!-- Diagonal Precision Ticks -->
    <line x1="100" y1="84" x2="114" y2="98" stroke-width="1.5" opacity="0.5" />
    <line x1="412" y1="84" x2="398" y2="98" stroke-width="1.5" opacity="0.5" />
    <line x1="100" y1="396" x2="114" y2="382" stroke-width="1.5" opacity="0.5" />
    <line x1="412" y1="396" x2="398" y2="382" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- Glowing Orbit Particle Flares -->
  <circle cx="120" cy="115" r="5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="120" cy="115" r="2.5" fill="#a5f3fc" />
  <circle cx="395" cy="155" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="395" cy="155" r="2" fill="#22d3ee" />
  <circle cx="370" cy="355" r="4" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="145" cy="340" r="3.5" fill="#38bdf8" />

  <!-- TOP FLOATING BADGE (Matching PageLoader Header Badge) -->
  <g transform="translate(256, 52)">
    <!-- Pill Capsule Background -->
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#0891b2" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75" />
    <!-- Mini Red Circle with Gold Star -->
    <circle cx="-120" cy="0" r="9" fill="#dc2626" stroke="#fef08a" stroke-width="1" />
    <polygon points="-120,-6 -118,-1 -113,-1 -117,2 -115,7 -120,4 -125,7 -123,2 -127,-1 -122,-1" fill="#fde047" />
    <!-- Badge Label -->
    <text x="-95" y="4" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#a5f3fc" letter-spacing="1.2">CỔNG THÔNG TIN SỐ MTTQ</text>
  </g>

  <!-- CENTER EMBLEM OF MTTQ VIỆT NAM -->
  <!-- Outer Glowing Emblem Aura -->
  <circle cx="256" cy="235" r="88" fill="url(#cyanAura)" />
  
  <!-- Outer Gold & Cyan Double Rim -->
  <circle cx="256" cy="235" r="82" fill="url(#goldGrad)" />
  <circle cx="256" cy="235" r="78" fill="#580000" />
  <circle cx="256" cy="235" r="76" fill="url(#redEmblem)" />
  <circle cx="256" cy="235" r="74" fill="none" stroke="url(#goldLight)" stroke-width="1.5" />

  <!-- 12 Radiating Sunburst Rays -->
  <g fill="url(#goldLight)" opacity="0.95">
    <polygon points="256,162 259,195 253,195" />
    <polygon points="256,308 259,275 253,275" />
    <polygon points="183,235 216,238 216,232" />
    <polygon points="329,235 296,238 296,232" />

    <polygon points="204,183 228,207 223,202" />
    <polygon points="308,287 284,263 289,268" />
    <polygon points="308,183 284,207 289,202" />
    <polygon points="204,287 228,263 223,268" />

    <polygon points="219,168 238,198 232,195" />
    <polygon points="293,302 274,272 280,275" />
    <polygon points="293,168 274,198 280,195" />
    <polygon points="219,302 238,272 232,275" />
  </g>

  <!-- Arc Text: MẶT TRẬN TỔ QUỐC VIỆT NAM -->
  <path id="emblemArc" d="M 194,235 A 62,62 0 1,1 318,235" fill="none" />
  <text font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-weight="900" font-size="8.5" fill="url(#goldLight)" letter-spacing="1.2" text-anchor="middle">
    <textPath href="#emblemArc" startOffset="50%">MẶT TRẬN TỔ QUỐC VIỆT NAM</textPath>
  </text>

  <!-- Inner Disc with Gold Border -->
  <circle cx="256" cy="235" r="48" fill="url(#redEmblem)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Stylized Lotus Garland at Base -->
  <path d="M 215,245 C 222,278 290,278 297,245 C 284,265 228,265 215,245 Z" fill="url(#goldGrad)" />
  <path d="M 228,255 C 241,272 271,272 284,255 C 273,265 239,265 228,255 Z" fill="#ffffff" />

  <!-- Center Golden Star -->
  <polygon points="256,198 265,224 292,224 270,240 279,266 256,250 233,266 242,240 220,224 247,224" fill="url(#goldLight)" stroke="#b45309" stroke-width="0.8" />

  <!-- LOWER BRANDING & DIGITAL BAR (Matching PageLoader Titles & Progress) -->
  <!-- Title Line 1: UỶ BAN MTTQ VIỆT NAM -->
  <text x="256" y="375" text-anchor="middle" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1.5">ỦY BAN MTTQ VIỆT NAM</text>

  <!-- Title Line 2: PHƯỜNG CHÁNH HIỆP (Glowing Cyan) -->
  <text x="256" y="402" text-anchor="middle" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-size="18" font-weight="900" fill="#67e8f9" letter-spacing="2.5" filter="url(#softGlow)">PHƯỜNG CHÁNH HIỆP</text>

  <!-- Progress Bar (The signature loading visual from PageLoader) -->
  <g transform="translate(256, 436)">
    <!-- Track -->
    <rect x="-110" y="-5" width="220" height="10" rx="5" fill="#0f172a" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Active Gradient Fill (65% Progress) -->
    <rect x="-108" y="-3.5" width="150" height="7" rx="3.5" fill="url(#progressGrad)" filter="url(#softGlow)" />
    <!-- Pulsing Cyan Head Dot -->
    <circle cx="42" cy="0" r="5" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="42" cy="0" r="2.5" fill="#22d3ee" />
  </g>

  <!-- Subtitle Tagline -->
  <text x="256" y="468" text-anchor="middle" font-family="'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif" font-size="10" font-weight="700" fill="#93c5fd" letter-spacing="2">HỆ THỐNG VĂN PHÒNG SỐ</text>
</svg>